<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classroom Cold-Call Tool</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 10px; margin: 0; background-color: #f0f2f5; color: #333; overflow-x: hidden; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: block; width: 100%; max-width: 400px; margin: 0 auto; box-sizing: border-box; }
        
        .header-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        select { flex: 1; padding: 10px; font-size: 1.1rem; border-radius: 8px; border: 2px solid #3498db; background: white; outline: none; }
        .btn-settings { padding: 10px; background: #ecf0f1; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .btn-settings:active { background: #bdc3c7; }

        #result-container { background: #e8f4fd; border-radius: 10px; padding: 15px; margin: 15px 0; border: 1px dashed #3498db; }
        #result { font-size: 5rem; font-weight: bold; color: #2c3e50; line-height: 1.2; margin: 5px 0; }
        .label { font-size: 0.75rem; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; display: block; margin-bottom: 5px; }

        button { font-family: inherit; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: all 0.2s; }
        .btn-gen { background-color: #2ecc71; color: white; width: 100%; font-size: 1.3rem; padding: 18px; margin-bottom: 10px; box-shadow: 0 4px #27ae60; }
        .btn-gen:active { transform: translateY(2px); box-shadow: 0 1px #27ae60; }
        
        .secondary-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-undo { background-color: #f39c12; color: white; flex: 1; padding: 12px; }
        .btn-reset { background-color: #e74c3c; color: white; flex: 1; padding: 12px; }

        #history-box { text-align: left; background: #fafafa; padding: 12px; border-radius: 8px; border: 1px solid #eee; }
        #history-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 20px; }
        .num-chip { background: #3498db; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
        .num-chip:hover { background: #c0392b; text-decoration: line-through; }
        
        .stats { margin-top: 15px; font-size: 0.85rem; color: #95a5a6; font-weight: bold; }
        .empty { color: #e74c3c; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 320px; text-align: left; }
        .modal h3 { margin-top: 0; color: #2c3e50; text-align: center; }
        .modal input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .modal button { width: 100%; padding: 12px; margin-top: 5px; }
        
        .btn-save { background: #3498db; color: white; }
        .btn-add { background: #2ecc71; color: white; }
        .btn-cancel { background: #bdc3c7; color: white; }
        .btn-danger { background: #e74c3c; color: white; margin-top: 20px !important; }
    </style>
</head>
<body>

    <div class="container">
        <label class="label" style="text-align: left;">Current Roster</label>
        <div class="header-row">
            <select id="periodSelector" onchange="switchPeriod()"></select>
            <button class="btn-settings" onclick="openSettings()">⚙️</button>
        </div>

        <div id="result-container">
            <span class="label">Current Pick</span>
            <div id="result">?</div>
        </div>
        
        <button class="btn-gen" onclick="generateNumber()">NEXT STUDENT</button>

        <div class="secondary-controls">
            <button class="btn-undo" onclick="undoLast()">Undo</button>
            <button class="btn-reset" onclick="showResetModal('manual')">Reset</button>
        </div>

        <div id="history-box">
            <span class="label">Already Called (Click to Remove)</span>
            <div id="history-list"></div>
        </div>
        
        <div class="stats" id="counter">Loading...</div>
    </div>

    <div id="alert-modal" class="modal-overlay">
        <div class="modal" style="text-align: center;">
            <h3 id="alert-title">Alert</h3>
            <p id="alert-text" style="color: #7f8c8d; font-size: 0.9rem; margin-bottom: 20px;">Message</p>
            <button class="btn-reset" onclick="doReset()">Yes, Reset</button>
            <button class="btn-cancel" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal">
            <h3>Class Settings</h3>
            
            <label class="label">Class Name</label>
            <input type="text" id="edit-name" placeholder="e.g., Period 6">
            
            <label class="label">Total Number of Students</label>
            <input type="number" id="edit-max" min="1" max="100">
            
            <button class="btn-save" onclick="saveSettings()">💾 Save Changes</button>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            <button class="btn-add" onclick="addNewClass()">➕ Add New Class</button>
            <button class="btn-danger" onclick="deleteClass()">🗑️ Delete This Class</button>
            <button class="btn-cancel" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <script>
        // Data Structure
        let appData = JSON.parse(localStorage.getItem('classroomDataV3'));
        
        // If no data exists, create a default setup
        if (!appData) {
            appData = {
                currentId: "class_1",
                classes: {
                    "class_1": { name: "Period 1", max: 32, used: [], last: "?" },
                    "class_2": { name: "Period 2", max: 32, used: [], last: "?" }
                }
            };
        }

        function save() {
            localStorage.setItem('classroomDataV3', JSON.stringify(appData));
            updateUI();
        }

        function updateUI() {
            const selector = document.getElementById('periodSelector');
            selector.innerHTML = ""; // Clear dropdown
            
            // Populate Dropdown
            for (const [id, data] of Object.entries(appData.classes)) {
                const option = document.createElement('option');
                option.value = id;
                option.innerText = data.name;
                if (id === appData.currentId) option.selected = true;
                selector.appendChild(option);
            }

            const currentClass = appData.classes[appData.currentId];
            document.getElementById('result').innerText = currentClass.last;
            
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = ""; 
            
            [...currentClass.used].sort((a,b) => a-b).forEach(num => {
                const chip = document.createElement('div');
                chip.className = 'num-chip';
                chip.innerText = num;
                chip.onclick = () => removeSpecific(num);
                listDiv.appendChild(chip);
            });
            
            if(currentClass.used.length === 0) listDiv.innerHTML = "<span style='color:#ccc;'>No one called yet.</span>";
            
            const remaining = currentClass.max - currentClass.used.length;
            const counterEl = document.getElementById('counter');
            counterEl.innerText = `${remaining} students left (out of ${currentClass.max})`;
            counterEl.className = remaining === 0 ? "stats empty" : "stats";
        }

        function switchPeriod() { 
            appData.currentId = document.getElementById('periodSelector').value; 
            save(); 
        }

        function generateNumber() {
            const currentClass = appData.classes[appData.currentId];
            if (currentClass.used.length >= currentClass.max) { showResetModal('auto'); return; }
            
            let randomNumber;
            do { randomNumber = Math.floor(Math.random() * currentClass.max) + 1; } 
            while (currentClass.used.includes(randomNumber));
            
            currentClass.used.push(randomNumber);
            currentClass.last = randomNumber;
            save();
        }

        function undoLast() {
            const currentClass = appData.classes[appData.currentId];
            if (currentClass.used.length === 0) return;
            currentClass.used.pop();
            currentClass.last = currentClass.used.length > 0 ? currentClass.used[currentClass.used.length - 1] : "?";
            save();
        }

        function removeSpecific(num) {
            const currentClass = appData.classes[appData.currentId];
            currentClass.used = currentClass.used.filter(n => n !== num);
            if (currentClass.last === num) {
                currentClass.last = currentClass.used.length > 0 ? currentClass.used[currentClass.used.length - 1] : "?";
            }
            save();
        }

        function showResetModal(type) { 
            document.getElementById('alert-title').innerText = (type === 'auto') ? "End of Roster!" : "Reset List?";
            document.getElementById('alert-text').innerText = (type === 'auto') ? "Everyone has been called. Reset the list?" : "This will clear all progress for this class.";
            document.getElementById('alert-modal').style.display = 'flex'; 
        }

        function doReset() { 
            appData.classes[appData.currentId].used = []; 
            appData.classes[appData.currentId].last = "?"; 
            closeModals(); 
            save(); 
        }

        function openSettings() {
            const currentClass = appData.classes[appData.currentId];
            document.getElementById('edit-name').value = currentClass.name;
            document.getElementById('edit-max').value = currentClass.max;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function saveSettings() {
            const newName = document.getElementById('edit-name').value || "Unnamed Class";
            let newMax = parseInt(document.getElementById('edit-max').value) || 32;
            
            const currentClass = appData.classes[appData.currentId];
            currentClass.name = newName;
            currentClass.max = newMax;
            
            currentClass.used = currentClass.used.filter(num => num <= newMax);
            if (currentClass.last > newMax) currentClass.last = "?";

            closeModals();
            save();
        }

        function addNewClass() {
            const newId = 'class_' + Date.now(); 
            appData.classes[newId] = { name: "New Class", max: 30, used: [], last: "?" };
            appData.currentId = newId; 
            closeModals();
            save();
            openSettings(); 
        }

        function deleteClass() {
            if (Object.keys(appData.classes).length <= 1) {
                alert("You must have at least one class!");
                return;
            }
            if (confirm("Are you sure you want to delete this class permanently?")) {
                delete appData.classes[appData.currentId];
                appData.currentId = Object.keys(appData.classes)[0]; 
                closeModals();
                save();
            }
        }

        function closeModals() {
            document.getElementById('alert-modal').style.display = 'none';
            document.getElementById('settings-modal').style.display = 'none';
        }

        updateUI();

        // Register Offline Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("App is ready for offline use."))
            .catch(err => console.log("Service Worker failed: ", err));
        }
    </script>
</body>
</html>
